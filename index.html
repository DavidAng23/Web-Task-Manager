<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Task Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .completed-state {
      text-decoration: line-through;
      color: #9ca3af;
      transition-property: color, text-decoration-color;
      transition-duration: 300ms;
    }
  </style>
  <script defer src="app.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex flex-col items-center p-4">
  <header class="w-full max-w-2xl mx-auto text-center my-8">
    <h1 class="text-3xl font-bold text-slate-800 mb-1">Web Task Manager</h1>
    <p class="text-slate-500 text-sm">Kelola tugas harianmu dengan mudah</p>
  </header>

  <main class="w-full max-w-2xl mx-auto flex flex-col gap-6">
    <section class="bg-white rounded-xl shadow-md p-6">
      <form id="task-form" class="space-y-4">
        <div>
          <label for="task-title" class="block text-sm font-medium text-slate-700 mb-1">Judul Tugas</label>
          <input
            type="text"
            id="task-title"
            placeholder="Tambahkan judul tugas..."
            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
            required
          />
        </div>
        <div>
          <label for="task-category" class="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
          <select
            id="task-category"
            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition bg-white"
          >
            <option value="Pribadi">Pribadi</option>
            <option value="Kerja">Kerja</option>
            <option value="Kuliah">Kuliah</option>
          </select>
        </div>
        <div>
          <label for="task-deadline" class="block text-sm font-medium text-slate-700 mb-1">Deadline</label>
          <input
            type="date"
            id="task-deadline"
            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
            required
          />
        </div>
        <div class="flex justify-end">
          <button
            type="submit"
            class="px-6 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition transform hover:scale-105"
          >
            Tambah Tugas
          </button>
        </div>
      </form>
    </section>

    <section class="bg-white rounded-xl shadow-md p-6">
      <div id="filter-tabs" class="flex flex-wrap gap-2 mb-4 border-b border-slate-200">
        <button id="filter-sema" data-filter="all" class="filter-btn px-4 py-2 text-sm font-medium rounded-t-lg border-b-2 border-transparent text-slate-600 hover:text-blue-600 hover:border-blue-500 transition">
          Semua
        </button>
        <button id="filter-aktif" data-filter="active" class="filter-btn px-4 py-2 text-sm font-medium rounded-t-lg border-b-2 border-transparent text-slate-600 hover:text-blue-600 hover:border-blue-500 transition">
          Aktif
        </button>
        <button id="filter-selesai" data-filter="completed" class="filter-btn px-4 py-2 text-sm font-medium rounded-t-lg border-b-2 border-transparent text-slate-600 hover:text-blue-600 hover:border-blue-500 transition">
          Selesai
        </button>
      </div>
      <ul id="task-list" class="space-y-3">
      </ul>
    </section>

    <section class="bg-white rounded-xl shadow-md p-4 flex justify-between items-center">
      <div class="text-center">
        <span class="text-2xl font-bold text-blue-600" id="stat-total">0</span>
        <p class="text-xs text-slate-500">Total Tugas</p>
      </div>
      <div class="w-px h-10 bg-slate-200"></div>
      <div class="text-center">
        <span class="text-2xl font-bold text-green-600" id="stat-completed">0</span>
        <p class="text-xs text-slate-500">Tugas Selesai</p>
      </div>
    </section>
  </main>

  <footer class="w-full max-w-2xl mx-auto text-center my-8 text-slate-400 text-sm">
    Dibuat dengan Tailwind CSS &amp; Vanilla JavaScript
  </footer>

  <div id="toast" class="fixed bottom-6 right-6 hidden max-w-xs w-full bg-slate-800 text-white px-4 py-3 rounded-lg shadow-lg flex items-center space-x-3 transform transition-transform duration-300">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.617 4.5A9 9 0 1111.5 3a9 9 0 018.117 5.5z" />
    </svg>
    <span id="toast-msg">Tugas telah dihapus</span>
  </div>
</body>
</html>
